<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="系统学习 LLM 基础、模型生命周期、AI Infra、RAG 与 Agent。">
  <meta name="theme-color" content="#155eef">
  <title>LLM &amp; AI Infra Handbook</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <div id="app">正在加载手册…</div>
  <noscript>这个知识手册需要启用 JavaScript 才能读取 Markdown 章节。</noscript>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/contrib/auto-render.min.js"></script>
  <script>
    (function () {
      var stored = localStorage.getItem('handbook-theme');
      if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    }());

    window.$docsify = {
      name: 'LLM & AI Infra Handbook',
      nameLink: '#/',
      repo: 'https://github.com/YangShuai52/infra-handbook',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md', '/.*/_navbar.md': '/_navbar.md' },
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 2,
      relativePath: false,
      search: {
        paths: 'auto',
        depth: 5,
        placeholder: '搜索概念、机制或故障…',
        noData: '没有找到相关内容',
        hideOtherSidebarContent: false
      },
      pagination: { previousText: '上一节', nextText: '下一节', crossChapter: true },
      copyCode: { buttonText: '复制', errorText: '复制失败', successText: '已复制' },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var main = document.querySelector('.markdown-section');
            if (main) {
              main.id = 'main';
              if (window.renderMathInElement) {
                renderMathInElement(main, {
                  delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false }
                  ],
                  ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                  throwOnError: false
                });
              }
            }
            document.querySelectorAll('.sidebar-nav > ul > li > ul > li').forEach(function (item) {
              item.classList.toggle('module-open', !!item.querySelector('a.active'));
            });
            if (window.mountHandbookThemeToggle) window.mountHandbookThemeToggle();
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="theme.js"></script>
</body>
</html>
