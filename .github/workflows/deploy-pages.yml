name: Deploy handbook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "llm-ai-infra-handbook/backend/kb/**"
      - "llm-ai-infra-handbook/site/**"
      - "llm-ai-infra-handbook/tools/build_handbook.py"
      - "llm-ai-infra-handbook/tools/validate_frontmatter.py"
      - "llm-ai-infra-handbook/tools/validate_handbook.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: llm-ai-infra-handbook
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install pyyaml
      - name: Validate knowledge cards
        run: python tools/validate_frontmatter.py
      - name: Build static handbook
        run: python tools/build_handbook.py --output _site
      - name: Validate generated site
        run: python tools/validate_handbook.py _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: llm-ai-infra-handbook/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
