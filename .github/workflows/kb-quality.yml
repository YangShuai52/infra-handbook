name: Knowledge base quality

on:
  pull_request:
    paths:
      - "llm-ai-infra-handbook/backend/kb/**"
      - "llm-ai-infra-handbook/tools/validate_frontmatter.py"
      - ".github/workflows/kb-quality.yml"
  push:
    paths:
      - "backend/kb/**"
      - "tools/validate_frontmatter.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-ai-infra-handbook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python tools/validate_frontmatter.py
